<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - YouTube Tools</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>

</head>


<body class="bg-slate-50
             text-slate-900
             min-h-screen
             transition-colors
             duration-300
             dark:bg-slate-900
             dark:text-slate-100">


<!-- NAVBAR -->

<div
        th:replace="~{fragments/navbar :: navbar}"
        th:with="activePage='profile'">
</div>


<!-- MAIN -->

<div class="container mx-auto
            px-4
            max-w-2xl
            mt-10
            pb-12">


    <!-- PROFILE CARD -->

    <div class="bg-white
                dark:bg-slate-800
                rounded-2xl
                border
                border-slate-200
                dark:border-slate-700
                shadow-xl
                overflow-hidden">


        <!-- HEADER -->

        <div class="text-center
                    px-8
                    pt-8
                    pb-6
                    border-b
                    border-slate-200
                    dark:border-slate-700">


            <div class="mx-auto
                        w-20
                        h-20
                        rounded-full
                        bg-blue-100
                        dark:bg-blue-900/30
                        flex
                        items-center
                        justify-center
                        mb-4
                        ring-4
                        ring-blue-50
                        dark:ring-blue-900/20">

                <i class="bi bi-person
                          text-4xl
                          text-blue-600
                          dark:text-blue-400">
                </i>

            </div>


            <h1 class="text-3xl
                       font-bold">

                My Profile

            </h1>


            <p class="text-slate-500
                      dark:text-slate-400
                      mt-2">

                Manage your account information

            </p>

        </div>


        <!-- CONTENT -->

        <div class="p-8">


            <!-- SUCCESS MESSAGE -->

            <div
                    th:if="${param.updated}"
                    class="mb-6
                           bg-green-50
                           dark:bg-green-900/20
                           text-green-700
                           dark:text-green-400
                           border
                           border-green-200
                           dark:border-green-800
                           rounded-xl
                           p-4
                           flex
                           items-center
                           gap-3">

                <i class="bi bi-check-circle-fill"></i>

                <span>Profile updated successfully.</span>

            </div>


            <!-- PROFILE FORM -->

            <form
                    th:action="@{/profile/update}"
                    method="post">


                <!-- CSRF -->

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">


                <!-- NAME -->

                <div class="mb-6">

                    <label
                            for="name"
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-700
                                   dark:text-slate-300
                                   mb-2">

                        Full Name

                    </label>


                    <div class="relative">

                        <i class="bi bi-person
                                  absolute
                                  left-4
                                  top-1/2
                                  -translate-y-1/2
                                  text-slate-400">
                        </i>


                        <input
                                type="text"
                                id="name"
                                name="name"
                                th:value="${user.name}"
                                required

                                class="w-full
                                       pl-11
                                       pr-4
                                       py-3
                                       border
                                       border-slate-300
                                       dark:border-slate-600
                                       rounded-xl
                                       bg-white
                                       dark:bg-slate-700
                                       text-slate-900
                                       dark:text-slate-100
                                       outline-none
                                       focus:border-blue-500
                                       focus:ring-2
                                       focus:ring-blue-200
                                       dark:focus:ring-blue-800
                                       transition">

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="mb-6">

                    <label
                            for="email"
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-700
                                   dark:text-slate-300
                                   mb-2">

                        Email Address

                    </label>


                    <div class="relative">

                        <i class="bi bi-envelope
                                  absolute
                                  left-4
                                  top-1/2
                                  -translate-y-1/2
                                  text-slate-400">
                        </i>


                        <input
                                type="email"
                                id="email"
                                th:value="${user.email}"
                                readonly

                                class="w-full
                                       pl-11
                                       pr-4
                                       py-3
                                       border
                                       border-slate-300
                                       dark:border-slate-600
                                       rounded-xl
                                       bg-slate-100
                                       dark:bg-slate-900
                                       text-slate-600
                                       dark:text-slate-400
                                       cursor-not-allowed">

                    </div>


                    <p class="text-xs
                              text-slate-500
                              dark:text-slate-400
                              mt-2">

                        <i class="bi bi-info-circle mr-1"></i>
                        Email address cannot be changed.

                    </p>

                </div>


                <!-- MEMBER SINCE -->

                <div class="mb-6">

                    <label
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-700
                                   dark:text-slate-300
                                   mb-2">

                        Member Since

                    </label>


                    <div class="relative">

                        <i class="bi bi-calendar3
                                  absolute
                                  left-4
                                  top-1/2
                                  -translate-y-1/2
                                  text-slate-400">
                        </i>


                        <input
                                type="text"

                                th:value="${#temporals.format(
                                    user.createdAt,
                                    'dd MMM yyyy'
                                )}"

                                readonly

                                class="w-full
                                       pl-11
                                       pr-4
                                       py-3
                                       border
                                       border-slate-300
                                       dark:border-slate-600
                                       rounded-xl
                                       bg-slate-100
                                       dark:bg-slate-900
                                       text-slate-600
                                       dark:text-slate-400
                                       cursor-not-allowed">

                    </div>

                </div>


                <!-- ROLE -->

                <div class="mb-8">

                    <label
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-700
                                   dark:text-slate-300
                                   mb-2">

                        Account Role

                    </label>


                    <div class="flex
                                items-center
                                gap-3
                                bg-blue-50
                                dark:bg-blue-900/20
                                text-blue-700
                                dark:text-blue-400
                                rounded-xl
                                px-4
                                py-3
                                border
                                border-blue-100
                                dark:border-blue-900/30">

                        <i class="bi bi-shield-check text-lg"></i>

                        <span
                                class="font-medium"
                                th:text="${user.role}">

                            USER

                        </span>

                    </div>

                </div>


                <!-- UPDATE BUTTON -->

                <button
                        type="submit"

                        class="w-full
                               bg-blue-600
                               hover:bg-blue-700
                               text-white
                               font-semibold
                               py-3
                               px-6
                               rounded-xl
                               shadow-lg
                               hover:shadow-blue-500/20
                               transition-all
                               duration-200
                               flex
                               items-center
                               justify-center
                               gap-2">

                    <i class="bi bi-save"></i>

                    Update Profile

                </button>


            </form>

        </div>

    </div>

</div>

</body>
</html>
