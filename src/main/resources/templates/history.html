<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>History - YouTube Tools</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>

</head>


<body class="bg-slate-50
             text-slate-900
             min-h-screen
             dark:bg-slate-900
             dark:text-slate-100">


<!-- =========================================================
     NAVBAR
========================================================= -->

<div
        th:replace="~{fragments/navbar :: navbar}"
        th:with="activePage='history'">
</div>


<!-- =========================================================
     MAIN CONTAINER
========================================================= -->

<div class="container mx-auto px-4 max-w-6xl mt-12 pb-12">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="flex flex-col
                md:flex-row
                justify-between
                items-center
                gap-4
                mb-10">


        <div>

            <h1 class="text-4xl
                       md:text-5xl
                       font-extrabold
                       text-blue-600
                       dark:text-blue-400">

                History

            </h1>


            <p class="text-slate-600
                      dark:text-slate-400
                      mt-2">

                View your recently used YouTube Tools.

            </p>

        </div>


        <!-- CLEAR ALL -->

        <div th:if="${!#lists.isEmpty(historyList)}">

            <form
                    th:action="@{/history/clear}"
                    method="post"
                    onsubmit="return confirmClearHistory();">

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">

                <button
                        type="submit"
                        class="bg-red-500
                               hover:bg-red-600
                               text-white
                               px-5
                               py-3
                               rounded-xl
                               font-semibold
                               flex
                               items-center
                               gap-2
                               transition">

                    <i class="bi bi-trash3"></i>

                    Clear All

                </button>

            </form>

        </div>

    </div>


    <!-- =====================================================
         EMPTY STATE
    ====================================================== -->

    <div
            th:if="${#lists.isEmpty(historyList)}"

            class="bg-white
                   dark:bg-slate-800
                   border
                   border-slate-200
                   dark:border-slate-700
                   rounded-2xl
                   shadow-lg
                   p-12
                   text-center">


        <i class="bi bi-clock-history
                  text-6xl
                  text-slate-400">
        </i>


        <h2 class="text-2xl
                   font-semibold
                   mt-5">

            No History Yet

        </h2>


        <p class="text-slate-500
                  dark:text-slate-400
                  mt-3">

            Start using YouTube Tools and your activity
            will appear here.

        </p>


        <a
                href="/"
                class="inline-flex
                       items-center
                       gap-2
                       mt-6
                       bg-blue-600
                       hover:bg-blue-700
                       text-white
                       px-5
                       py-3
                       rounded-xl
                       font-semibold
                       transition">

            <i class="bi bi-play-circle"></i>

            Explore Tools

        </a>

    </div>


    <!-- =====================================================
         HISTORY LIST
    ====================================================== -->

    <div
            th:if="${!#lists.isEmpty(historyList)}"
            class="space-y-5">


        <div
                th:each="history : ${historyList}"

                class="bg-white
                       dark:bg-slate-800
                       border
                       border-slate-200
                       dark:border-slate-700
                       rounded-2xl
                       shadow-md
                       hover:shadow-lg
                       p-5
                       transition">


            <div class="flex flex-col
                        md:flex-row
                        gap-5">


                <!-- =================================================
                     THUMBNAIL
                ================================================== -->

                <div
                        th:if="${history.thumbnailUrl != null}"
                        class="md:w-56
                               flex-shrink-0">


                    <img
                            th:src="${history.thumbnailUrl}"
                            alt="Video Thumbnail"

                            class="w-full
                                   h-32
                                   object-cover
                                   rounded-xl">


                </div>


                <!-- =================================================
                     CONTENT
                ================================================== -->

                <div class="flex-1">


                    <!-- TOOL TYPE -->

                    <div class="flex
                                items-center
                                justify-between
                                gap-3
                                mb-3">


                        <span
                                class="inline-flex
                                       items-center
                                       gap-2
                                       bg-blue-100
                                       text-blue-700
                                       dark:bg-blue-900/30
                                       dark:text-blue-400
                                       px-3
                                       py-1
                                       rounded-full
                                       text-xs
                                       font-semibold">


                            <i class="bi bi-tools"></i>

                            <span
                                    th:text="${history.toolType}">
                            </span>

                        </span>


                        <!-- DATE -->

                        <span
                                class="text-xs
                                       text-slate-400"
                                th:text="${history.createdAt}">

                        </span>

                    </div>


                    <!-- TITLE -->

                    <h2
                            class="text-xl
                                   font-semibold
                                   text-slate-900
                                   dark:text-slate-100"

                            th:text="${history.title != null
                                      ? history.title
                                      : 'YouTube Video'}">

                    </h2>


                    <!-- INPUT -->

                    <p
                            th:if="${history.input != null}"

                            class="text-sm
                                   text-slate-500
                                   dark:text-slate-400
                                   mt-2
                                   break-all"

                            th:text="${history.input}">

                    </p>


                    <!-- VIDEO ID -->

                    <p
                            th:if="${history.videoId != null}"

                            class="text-xs
                                   text-slate-400
                                   mt-2">

                        Video ID:

                        <span
                                th:text="${history.videoId}">
                        </span>

                    </p>


                    <!-- =================================================
                         ACTIONS
                    ================================================== -->

                    <div
                            class="flex
                                   flex-wrap
                                   items-center
                                   gap-3
                                   mt-5">


                        <!-- OPEN TOOL -->

                        <a
                                th:href="${history.toolType == 'SEO_TAGS'
                                          ? '/'
                                          : history.toolType == 'VIDEO_DETAILS'
                                          ? '/video-details'
                                          : history.toolType == 'TRANSCRIPT'
                                          ? '/transcript'
                                          : history.toolType == 'THUMBNAIL'
                                          ? '/thumbnail'
                                          : '/'}"

                                class="bg-blue-600
                                       hover:bg-blue-700
                                       text-white
                                       text-sm
                                       font-medium
                                       px-4
                                       py-2
                                       rounded-lg
                                       flex
                                       items-center
                                       gap-2
                                       transition">


                            <i class="bi bi-box-arrow-up-right"></i>

                            Open Tool

                        </a>


                        <!-- DELETE -->

                        <form
                                th:action="@{/history/delete/{id}(id=${history.id})}"
                                method="post"
                                onsubmit="return confirmDelete();">


                            <input
                                    type="hidden"
                                    th:name="${_csrf.parameterName}"
                                    th:value="${_csrf.token}">


                            <button
                                    type="submit"

                                    class="bg-red-500
                                           hover:bg-red-600
                                           text-white
                                           text-sm
                                           font-medium
                                           px-4
                                           py-2
                                           rounded-lg
                                           flex
                                           items-center
                                           gap-2
                                           transition">


                                <i class="bi bi-trash"></i>

                                Delete

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

    function confirmDelete() {

        return confirm(
            "Are you sure you want to delete this history?"
        );

    }


    function confirmClearHistory() {

        return confirm(
            "Are you sure you want to clear ALL your history?"
        );

    }

</script>


</body>

</html>
