<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Transcript Generator</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1d4ed8'
                        },
                        accent: '#22c55e'
                    }
                }
            }
        }
    </script>

    <style>

        .main-title {
            background: linear-gradient(90deg, #2563eb, #22c55e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .gradient-header {
            background: linear-gradient(
                    135deg,
                    rgba(37, 99, 235, .08),
                    rgba(34, 197, 94, .08)
            );

            border: 1px dashed #e2e8f0;
        }

        .transcript-box {
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .error {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border-left: 4px solid #ef4444;
        }

        .success {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            border-left: 4px solid #10b981;
        }

        .dark .gradient-header {
            border-color: #334155;
        }

    </style>

</head>


<body class="bg-slate-50 text-slate-900 min-h-screen
             transition-colors duration-300
             dark:bg-slate-900 dark:text-slate-100">


<!-- Navbar -->

<div th:replace="~{fragments/navbar :: navbar}"
     th:with="activePage='transcript'">
</div>


<!-- Main Container -->

<div class="container mx-auto px-4 max-w-4xl mt-12 pb-12">


    <!-- Heading -->

    <div class="text-center mb-8">

        <h1 class="main-title text-4xl md:text-5xl font-extrabold mb-4">
            YouTube Transcript Generator
        </h1>

        <div class="gradient-header rounded-xl p-4 mt-6">

            <p class="text-slate-600 dark:text-slate-400 text-lg">
                Enter a YouTube video URL and extract its transcript instantly.
            </p>

        </div>

    </div>


    <!-- Form -->

    <div class="bg-white dark:bg-slate-800
                rounded-2xl
                border border-slate-200 dark:border-slate-700
                shadow-lg
                p-6 mb-8">

        <form th:action="@{/transcript}"
              method="post">

            <label
                    for="videoUrl"
                    class="block text-sm font-medium
                           text-slate-700 dark:text-slate-300 mb-2">

                YouTube Video URL

            </label>


            <input
                    type="text"
                    id="videoUrl"
                    name="videoUrl"
                    th:value="${videoUrl}"
                    placeholder="https://www.youtube.com/watch?v=..."
                    required

                    class="w-full px-4 py-3
                           border border-slate-300 dark:border-slate-600
                           rounded-lg
                           bg-white dark:bg-slate-700
                           text-slate-900 dark:text-slate-100

                           focus:border-blue-500
                           focus:ring-2
                           focus:ring-blue-200
                           dark:focus:ring-blue-800

                           transition-colors duration-200
                           mb-4">


            <button
                    type="submit"

                    class="w-full
                           bg-blue-600
                           hover:bg-blue-700
                           text-white
                           font-medium
                           py-3 px-6
                           rounded-lg
                           shadow-lg
                           transition-colors duration-200

                           flex
                           items-center
                           justify-center
                           gap-2">

                <i class="bi bi-file-text"></i>

                Get Transcript

            </button>

        </form>


        <!-- Error -->

        <div
                th:if="${error}"
                class="error rounded-lg p-4 mt-4"
                th:text="${error}">

        </div>

    </div>


    <!-- Transcript Result -->

    <div
            th:if="${transcript != null}"

            class="bg-white dark:bg-slate-800
                   rounded-2xl
                   border border-slate-200 dark:border-slate-700
                   shadow-lg
                   p-6">


        <!-- Header -->

        <div class="flex justify-between items-center mb-4">

            <div
                    class="flex items-center gap-2
                           font-bold
                           text-slate-900 dark:text-slate-100">

                <i class="bi bi-file-text text-blue-500"></i>

                <span>
                    Transcript
                </span>

            </div>


            <button
                    type="button"
                    onclick="copyTranscript()"

                    class="bg-blue-600
                           hover:bg-blue-700
                           text-white
                           text-sm
                           font-medium
                           py-2 px-4
                           rounded-lg

                           flex
                           items-center
                           gap-2">

                <i class="bi bi-clipboard"></i>

                Copy

            </button>

        </div>


        <!-- Language -->

        <div class="mb-4">

            <span
                    class="inline-flex
                           items-center
                           gap-2
                           bg-green-100
                           text-green-700
                           dark:bg-green-900/30
                           dark:text-green-400
                           px-3 py-2
                           rounded-lg
                           text-sm">

                <i class="bi bi-translate"></i>

                Hindi Transcript

            </span>

        </div>


        <!-- Transcript -->

        <div
                id="transcriptText"

                class="transcript-box

                       bg-slate-50
                       dark:bg-slate-900

                       border
                       border-slate-200
                       dark:border-slate-700

                       rounded-xl
                       p-5

                       text-slate-700
                       dark:text-slate-300">

            <span th:text="${transcript}"></span>

        </div>


        <!-- Copy success -->

        <div
                id="copySuccess"
                class="success hidden
                       rounded-lg
                       p-4
                       mt-4">

            Transcript copied to clipboard!

        </div>

    </div>

</div>


<script>

    function copyTranscript() {

        const text =
            document.getElementById("transcriptText").innerText;

        navigator.clipboard.writeText(text)

            .then(() => {

                const success =
                    document.getElementById("copySuccess");

                success.classList.remove("hidden");

                setTimeout(() => {

                    success.classList.add("hidden");

                }, 2000);

            })

            .catch(() => {

                alert("Could not copy transcript.");

            });
    }

</script>


</body>

</html>
