<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta name="_csrf"
          th:content="${_csrf.token}">

    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Transcript Generator</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1d4ed8'
                        },
                        accent: '#22c55e'
                    }
                }
            }
        }
    </script>

    <style>

        .main-title {
            background: linear-gradient(90deg, #2563eb, #22c55e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .gradient-header {
            background: linear-gradient(
                    135deg,
                    rgba(37, 99, 235, .08),
                    rgba(34, 197, 94, .08)
            );

            border: 1px dashed #e2e8f0;
        }

        .transcript-box {
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .error {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border-left: 4px solid #ef4444;
        }

        .success {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            border-left: 4px solid #10b981;
        }

        .dark .gradient-header {
            border-color: #334155;
        }

    </style>

</head>


<body class="bg-slate-50 text-slate-900 min-h-screen
             transition-colors duration-300
             dark:bg-slate-900 dark:text-slate-100">


<!-- Navbar -->

<div th:replace="~{fragments/navbar :: navbar}"
     th:with="activePage='transcript'">
</div>


<!-- Main Container -->

<div class="container mx-auto px-4 max-w-4xl mt-12 pb-12">


    <!-- Heading -->

    <div class="text-center mb-8">

        <h1 class="main-title text-4xl md:text-5xl font-extrabold mb-4">
            YouTube Transcript Generator
        </h1>

        <div class="gradient-header rounded-xl p-4 mt-6">

            <p class="text-slate-600 dark:text-slate-400 text-lg">
                Enter a YouTube video URL and extract its transcript instantly.
            </p>

        </div>

    </div>


    <!-- Form -->

    <div class="bg-white dark:bg-slate-800
                rounded-2xl
                border border-slate-200 dark:border-slate-700
                shadow-lg
                p-6 mb-8">

        <form id="transcriptForm"
              th:action="@{/transcript}"
              method="post">

            <label
                    for="videoUrl"
                    class="block text-sm font-medium
                           text-slate-700 dark:text-slate-300 mb-2">

                YouTube Video URL

            </label>


            <input
                    type="text"
                    id="videoUrl"
                    name="videoUrl"
                    th:value="${videoUrl}"
                    placeholder="https://www.youtube.com/watch?v=..."
                    required

                    class="w-full px-4 py-3
                           border border-slate-300 dark:border-slate-600
                           rounded-lg
                           bg-white dark:bg-slate-700
                           text-slate-900 dark:text-slate-100

                           focus:border-blue-500
                           focus:ring-2
                           focus:ring-blue-200
                           dark:focus:ring-blue-800

                           transition-colors duration-200
                           mb-4">


            <button
                    id="transcriptSubmitBtn"
                    type="submit"
                    class="bg-red-600 hover:bg-red-700 text-white font-medium px-6 py-3 rounded-lg">

    <span id="transcriptBtnText">
        <i class="bi bi-file-text"></i>
        Extract Transcript
    </span>

                <span id="transcriptLoadingText" class="hidden">
        <i class="bi bi-arrow-repeat animate-spin"></i>
        Extracting transcript...
    </span>
            </button>

        </form>


        <!-- Error -->

        <div
                th:if="${error}"
                class="error rounded-lg p-4 mt-4"
                th:text="${error}">

        </div>

    </div>


    <!-- Transcript Result -->

    <div
            th:if="${transcript != null}"

            class="bg-white dark:bg-slate-800
                   rounded-2xl
                   border border-slate-200 dark:border-slate-700
                   shadow-lg
                   p-6">


        <!-- Header -->

        <div class="flex justify-between items-center mb-4">

            <div
                    class="flex items-center gap-2
                           font-bold
                           text-slate-900 dark:text-slate-100">

                <i class="bi bi-file-text text-blue-500"></i>

                <span>
                    Transcript
                </span>

            </div>


            <button
                    type="button"
                    onclick="copyTranscript()"

                    class="bg-blue-600
                           hover:bg-blue-700
                           text-white
                           text-sm
                           font-medium
                           py-2 px-4
                           rounded-lg

                           flex
                           items-center
                           gap-2">

                <i class="bi bi-clipboard"></i>

                Copy

            </button>

        </div>


        <!-- Language -->

        <div class="mb-4">

            <span
                    class="inline-flex
                           items-center
                           gap-2
                           bg-green-100
                           text-green-700
                           dark:bg-green-900/30
                           dark:text-green-400
                           px-3 py-2
                           rounded-lg
                           text-sm">

                <i class="bi bi-translate"></i>

                Hindi Transcript

            </span>

        </div>


        <!-- Transcript -->

        <div
                id="transcriptText"

                class="transcript-box

                       bg-slate-50
                       dark:bg-slate-900

                       border
                       border-slate-200
                       dark:border-slate-700

                       rounded-xl
                       p-5

                       text-slate-700
                       dark:text-slate-300">

            <span th:text="${transcript}"></span>

        </div>


        <!-- Copy success -->

        <div
                id="copySuccess"
                class="success hidden
                       rounded-lg
                       p-4
                       mt-4">

            Transcript copied to clipboard!

        </div>
        <button
                sec:authorize="isAuthenticated()"
                type="button"
                id="transcriptFavoriteBtn"

                class="text-white
               text-sm
               font-medium
               py-2 px-4
               rounded-lg
               flex
               items-center
               gap-2
               transition-colors duration-200"

                th:classappend="${isFavorite}
            ? ' bg-green-600 hover:bg-green-700'
            : ' bg-yellow-500 hover:bg-yellow-600'"

                th:data-video-id="${videoId}"

                th:data-title="'YouTube Transcript'"

                th:data-thumbnail="'https://img.youtube.com/vi/' + ${videoId} + '/hqdefault.jpg'"

                th:data-channel="'YouTube'"

                th:disabled="${isFavorite}">

            <i
                    class="bi"
                    th:classappend="${isFavorite}
                ? ' bi-star-fill'
                : ' bi-star'">
            </i>

            <span
                    th:text="${isFavorite}
                ? 'Already in Favorites'
                : 'Add to Favorites'">
    </span>

        </button>

    </div>

</div>


<script>

    function copyTranscript() {

        const text =
            document.getElementById("transcriptText").innerText;

        navigator.clipboard.writeText(text)

            .then(() => {

                const success =
                    document.getElementById("copySuccess");

                success.classList.remove("hidden");

                setTimeout(() => {

                    success.classList.add("hidden");

                }, 2000);

            })

            .catch(() => {

                alert("Could not copy transcript.");

            });
    }

</script>
<script>

    async function saveTranscriptFavorite(button) {

        const formData =
            new URLSearchParams();


        formData.append(
            "videoId",
            button.dataset.videoId
        );

        formData.append(
            "title",
            button.dataset.title
        );

        formData.append(
            "thumbnailUrl",
            button.dataset.thumbnail
        );

        formData.append(
            "channelTitle",
            button.dataset.channel
        );


        const csrfToken =
            document
                .querySelector(
                    'meta[name="_csrf"]'
                )
                ?.getAttribute("content");


        const csrfHeader =
            document
                .querySelector(
                    'meta[name="_csrf_header"]'
                )
                ?.getAttribute("content");


        const headers = {
            "Content-Type":
                "application/x-www-form-urlencoded"
        };


        if (csrfToken && csrfHeader) {

            headers[csrfHeader] =
                csrfToken;
        }


        try {

            const response =
                await fetch(
                    "/favorites/add",
                    {
                        method: "POST",
                        headers: headers,
                        body: formData
                    }
                );


            const result =
                await response.json();


            button.classList.remove(
                "bg-yellow-500",
                "hover:bg-yellow-600"
            );


            button.classList.add(
                "bg-green-600",
                "hover:bg-green-700"
            );


            button.innerHTML = `
                <i class="bi bi-star-fill"></i>
                <span>
                    ${result.success
                ? "Added to Favorites"
                : "Already in Favorites"}
                </span>
            `;


            button.disabled = true;


        } catch (error) {

            console.error(error);

            alert(
                "Unable to add to favorites."
            );
        }
    }


    document.addEventListener(
        "DOMContentLoaded",
        () => {

            const button =
                document.getElementById(
                    "transcriptFavoriteBtn"
                );


            if (button &&
                !button.disabled) {

                button.addEventListener(
                    "click",
                    () =>
                        saveTranscriptFavorite(
                            button
                        )
                );
            }
        }
    );

</script>
<script>
    document.getElementById("transcriptForm")?.addEventListener("submit", function () {

        const button = document.getElementById("transcriptSubmitBtn");
        const normalText = document.getElementById("transcriptBtnText");
        const loadingText = document.getElementById("transcriptLoadingText");

        if (!button) return;

        button.disabled = true;
        button.classList.add("opacity-70", "cursor-not-allowed");

        normalText.classList.add("hidden");
        loadingText.classList.remove("hidden");
    });
</script>
</body>

</html>
