<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - YouTube Tools</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-50 min-h-screen
             flex items-center justify-center">

<div class="w-full max-w-md px-4">

    <div class="bg-white
                rounded-2xl
                shadow-lg
                border border-slate-200
                p-8">

        <div class="text-center mb-8">

            <h1 class="text-3xl
                       font-bold
                       text-slate-900">

                Create Account

            </h1>

            <p class="text-slate-500 mt-2">

                Create your YouTube Tools account

            </p>

        </div>


        <!-- General Error -->

        <div th:if="${error}"
             class="bg-red-50
                    text-red-600
                    border-l-4
                    border-red-500
                    p-4
                    rounded-lg
                    mb-5"
             th:text="${error}">
        </div>


        <form th:action="@{/register}"
              th:object="${registerRequest}"
              method="post">


            <!-- Name -->

            <div class="mb-5">

                <label
                        class="block text-sm
                               font-medium
                               text-slate-700
                               mb-2">

                    Name

                </label>

                <input
                        type="text"
                        th:field="*{name}"
                        placeholder="Enter your name"

                        class="w-full
                               px-4 py-3
                               border
                               border-slate-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500">

                <p
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}"
                        class="text-red-500
                               text-sm
                               mt-1">
                </p>

            </div>


            <!-- Email -->

            <div class="mb-5">

                <label
                        class="block text-sm
                               font-medium
                               text-slate-700
                               mb-2">

                    Email

                </label>

                <input
                        type="email"
                        th:field="*{email}"
                        placeholder="Enter your email"

                        class="w-full
                               px-4 py-3
                               border
                               border-slate-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500">

                <p
                        th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}"
                        class="text-red-500
                               text-sm
                               mt-1">
                </p>

            </div>


            <!-- Password -->

            <div class="mb-5">

                <label
                        class="block text-sm
                               font-medium
                               text-slate-700
                               mb-2">

                    Password

                </label>

                <input
                        type="password"
                        th:field="*{password}"
                        placeholder="Enter password"

                        class="w-full
                               px-4 py-3
                               border
                               border-slate-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500">

                <p
                        th:if="${#fields.hasErrors('password')}"
                        th:errors="*{password}"
                        class="text-red-500
                               text-sm
                               mt-1">
                </p>

            </div>


            <!-- Confirm Password -->

            <div class="mb-6">

                <label
                        class="block text-sm
                               font-medium
                               text-slate-700
                               mb-2">

                    Confirm Password

                </label>

                <input
                        type="password"
                        th:field="*{confirmPassword}"
                        placeholder="Confirm password"

                        class="w-full
                               px-4 py-3
                               border
                               border-slate-300
                               rounded-lg
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500">

                <p
                        th:if="${#fields.hasErrors('confirmPassword')}"
                        th:errors="*{confirmPassword}"
                        class="text-red-500
                               text-sm
                               mt-1">
                </p>

            </div>


            <!-- Submit -->

            <button
                    type="submit"

                    class="w-full
                           bg-blue-600
                           hover:bg-blue-700
                           text-white
                           font-medium
                           py-3
                           rounded-lg
                           transition">

                Create Account

            </button>

        </form>


        <div class="text-center mt-6">

            <span class="text-slate-500">
                Already have an account?
            </span>

            <a href="/login"
               class="text-blue-600
                      hover:text-blue-700
                      font-medium">

                Login

            </a>

        </div>

    </div>

</div>

</body>

</html>
