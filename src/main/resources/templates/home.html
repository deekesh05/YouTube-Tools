<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <!-- =====================================================
         CSRF
    ====================================================== -->

    <meta name="_csrf"
          th:content="${_csrf.token}">

    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">


    <title>YouTube SEO Tag Generator</title>


    <!-- =====================================================
         TAILWIND
    ====================================================== -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">


    <!-- =====================================================
         TAILWIND CONFIG
    ====================================================== -->

    <script>

        tailwind.config = {

            darkMode: 'class',

            theme: {

                extend: {

                    colors: {

                        primary: {

                            50: '#eff6ff',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1d4ed8'

                        },

                        accent: '#22c55e'

                    }

                }

            }

        };

    </script>


    <!-- =====================================================
         CUSTOM CSS
    ====================================================== -->

    <style>

        .main-title {

            background:
                    linear-gradient(
                            90deg,
                            #2563eb,
                            #22c55e
                    );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

        }


        .gradient-header {

            background:
                    linear-gradient(
                            135deg,
                            rgba(37,99,235,.08),
                            rgba(34,197,94,.08)
                    );

            border: 1px dashed #e2e8f0;

        }


        .tag {

            background:
                    rgba(
                            34,
                            197,
                            94,
                            0.15
                    );

            border:
                    1px solid #e2e8f0;

            transition:
                    transform .1s ease,
                    background .2s ease;

        }


        .tag:hover {

            transform:
                    translateY(-1px);

            background:
                    rgba(
                            34,
                            197,
                            94,
                            0.22
                    );

        }


        .error {

            background:
                    rgba(
                            239,
                            68,
                            68,
                            0.12
                    );

            color:
                    #ef4444;

            border-left:
                    4px solid #ef4444;

        }


        .success {

            background:
                    rgba(
                            16,
                            185,
                            129,
                            0.12
                    );

            color:
                    #10b981;

            border-left:
                    4px solid #10b981;

        }


        .dark .gradient-header {

            border-color:
                    #334155;

        }


        .dark .tag {

            border-color:
                    #334155;

        }


        .favorite-btn {

            transition:
                    all .2s ease;

        }


        .favorite-btn:hover {

            transform:
                    translateY(-1px);

        }


        .favorite-btn:disabled {

            cursor:
                    not-allowed;

            opacity:
                    0.9;

        }

    </style>

</head>


<body class="bg-slate-50
             text-slate-900
             min-h-screen
             transition-colors
             duration-300
             dark:bg-slate-900
             dark:text-slate-100">


<!-- =========================================================
     NAVBAR
========================================================= -->

<div
        th:replace="~{fragments/navbar :: navbar}"
        th:with="activePage='home'">
</div>


<!-- =========================================================
     MAIN CONTAINER
========================================================= -->

<div
        class="container
               mx-auto
               px-4
               max-w-2xl
               mt-12
               pb-12">


    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <div
            class="text-center
                   mb-8">


        <h1
                class="main-title
                       text-4xl
                       md:text-5xl
                       font-extrabold
                       mb-4">

            YouTube SEO Tag Generator

        </h1>


        <div
                class="gradient-header
                       rounded-xl
                       p-4
                       mt-6">


            <p
                    class="text-slate-600
                           dark:text-slate-400
                           text-lg
                           mb-0">

                Enter a YouTube video title to find and extract
                SEO tags from similar videos to optimize your content.

            </p>

        </div>

    </div>


    <!-- =====================================================
         SEARCH FORM
    ====================================================== -->

    <div
            class="bg-white
                   dark:bg-slate-800
                   rounded-2xl
                   border
                   border-slate-200
                   dark:border-slate-700
                   shadow-lg
                   p-6
                   mb-8">



        <form id="seoForm" th:action="@{/youtube/search}" method="post">


            <!-- CSRF -->

            <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">


            <!-- VIDEO TITLE -->

            <div
                    class="mb-6
                           text-start">


                <label
                        for="videoTitle"
                        class="block
                               text-sm
                               font-medium
                               text-slate-700
                               dark:text-slate-300
                               mb-2">

                    YouTube Video Title

                </label>


                <input
                        type="text"
                        id="videoTitle"
                        name="videoTitle"

                        class="w-full
                               px-4
                               py-3
                               border
                               border-slate-300
                               dark:border-slate-600
                               rounded-lg
                               bg-white
                               dark:bg-slate-700
                               text-slate-900
                               dark:text-slate-100
                               focus:border-blue-500
                               focus:ring-2
                               focus:ring-blue-200
                               dark:focus:ring-blue-800
                               transition-colors
                               duration-200"

                        placeholder="Enter the title of your YouTube video"

                        required>

            </div>


            <!-- GENERATE -->

            <button
                    id="seoSubmitBtn"
                    type="submit"
                    class="bg-red-600 hover:bg-red-700 text-white font-medium px-6 py-3 rounded-lg transition">

    <span id="seoBtnText">
        <i class="bi bi-search"></i>
        Generate SEO Tags
    </span>

                <span id="seoLoadingText" class="hidden">
        <i class="bi bi-arrow-repeat animate-spin"></i>
        Generating...
    </span>
            </button>


        </form>

    </div>


    <!-- =====================================================
         ERROR
    ====================================================== -->

    <div
            th:if="${error}"

            class="error
                   rounded-lg
                   p-4
                   mb-4"

            th:text="${error}">

    </div>


    <!-- =====================================================
         PRIMARY VIDEO
    ====================================================== -->

    <div
            th:if="${primaryVideo != null}">


        <div
                class="bg-white
                       dark:bg-slate-800
                       rounded-2xl
                       border
                       border-slate-200
                       dark:border-slate-700
                       shadow-lg
                       p-6
                       mb-8">


            <!-- HEADER -->

            <div
                    class="flex
                           justify-between
                           items-center
                           mb-4">


                <div
                        class="flex
                               items-center
                               gap-2
                               font-bold
                               text-slate-900
                               dark:text-slate-100">


                    <i
                            class="bi
                                   bi-star-fill
                                   text-blue-500">
                    </i>


                    <span>

                        Primary Video Tags

                    </span>

                </div>


                <!-- COPY TAGS -->

                <button
                        type="button"

                        class="bg-blue-600
                               hover:bg-blue-700
                               text-white
                               text-sm
                               font-medium
                               py-2
                               px-4
                               rounded-lg
                               transition-colors
                               duration-200
                               flex
                               items-center
                               gap-2"

                        th:onclick="'copyTags(\\'' + ${primaryVideo.tagsAsString} + '\\')'">


                    <i
                            class="bi
                                   bi-clipboard2-check">
                    </i>


                    Copy Tags

                </button>

            </div>


            <!-- TITLE -->

            <div
                    class="text-slate-600
                           dark:text-slate-400
                           mb-4"

                    th:text="${primaryVideo.title}">

            </div>


            <!-- CHANNEL -->

            <div
                    class="text-slate-600
                           dark:text-slate-400
                           mb-4"

                    th:text="${primaryVideo.channelTitle}">

            </div>


            <!-- =================================================
                 FAVORITE BUTTON
            ================================================== -->

            <div
                    sec:authorize="isAuthenticated()"
                    class="mb-5">


                <button
                <button
                        type="button"
                        class="favorite-btn
               text-white
               text-sm
               font-medium
               py-2
               px-4
               rounded-lg
               transition-colors
               duration-200
               flex
               items-center
               gap-2"
                        th:classappend="${favoriteVideoIds.contains(primaryVideo.id)}
            ? ' bg-green-600 hover:bg-green-700'
            : ' bg-yellow-500 hover:bg-yellow-600'"
                        th:data-video-id="${primaryVideo.id}"
                        th:data-title="${primaryVideo.title}"
                        th:data-thumbnail="${primaryVideo.thumbnailUrl}"
                        th:data-channel="${primaryVideo.channelTitle}"
                        th:disabled="${favoriteVideoIds.contains(primaryVideo.id)}">

                    <i
                            class="bi"
                            th:classappend="${favoriteVideoIds.contains(primaryVideo.id)}
                ? ' bi-star-fill'
                : ' bi-star'">
                    </i>

                    <span
                            th:text="${favoriteVideoIds.contains(primaryVideo.id)}
                ? 'Already in Favorites'
                : 'Add to Favorites'">
    </span>

                </button>

            </div>


            <!-- =================================================
                 TAGS
            ================================================== -->

            <div>


                <span
                        th:each="tag : ${primaryVideo.tags}"

                        class="tag
                               inline-flex
                               items-center
                               gap-2
                               rounded-full
                               px-3
                               py-2
                               mr-2
                               mb-2
                               text-sm">


                    <i
                            class="bi
                                   bi-hash">
                    </i>


                    <span
                            th:text="${tag}">
                    </span>


                </span>

            </div>

        </div>

    </div>


    <!-- =====================================================
         RELATED VIDEOS
    ====================================================== -->

    <div
            th:if="${relatedVideos != null}">


        <div
                class="bg-white
                       dark:bg-slate-800
                       rounded-2xl
                       border
                       border-slate-200
                       dark:border-slate-700
                       shadow-lg
                       p-6
                       mb-8">


            <!-- HEADER -->

            <div
                    class="flex
                           justify-between
                           items-center
                           mb-4">


                <div
                        class="flex
                               items-center
                               gap-2
                               font-bold
                               text-slate-900
                               dark:text-slate-100">


                    <i
                            class="bi
                                   bi-collection
                                   text-blue-500">
                    </i>


                    <span>

                        Related Videos Tags

                    </span>

                </div>


                <!-- COPY ALL -->

                <button
                        type="button"

                        class="bg-blue-600
                               hover:bg-blue-700
                               text-white
                               text-sm
                               font-medium
                               py-2
                               px-4
                               rounded-lg
                               transition-colors
                               duration-200
                               flex
                               items-center
                               gap-2"

                        th:onclick="'copyTags(\\'' + ${allTagsAsString} + '\\')'">


                    <i
                            class="bi
                                   bi-clipboard2">
                    </i>


                    Copy All

                </button>

            </div>


            <!-- RELATED VIDEO LIST -->

            <div
                    class="mt-4">


                <div
                        th:each="video : ${relatedVideos}"

                        class="mb-6
                               pb-5
                               border-b
                               border-slate-200
                               dark:border-slate-700
                               last:border-b-0">


                    <!-- VIDEO TITLE -->

                    <div
                            class="font-semibold
                                   text-slate-900
                                   dark:text-slate-100
                                   mb-2">


                        <i
                                class="bi
                                       bi-play-btn
                                       mr-2
                                       text-blue-500">
                        </i>


                        <span
                                th:text="${video.title}">
                        </span>


                    </div>


                    <!-- CHANNEL -->

                    <div
                            class="text-sm
                                   text-slate-500
                                   dark:text-slate-400
                                   mb-3"

                            th:if="${video.channelTitle != null}"

                            th:text="${video.channelTitle}">

                    </div>


                    <!-- =================================================
                         FAVORITE BUTTON
                    ================================================== -->

                    <div
                            sec:authorize="isAuthenticated()"
                            class="mb-3">




                        <button
                                type="button"
                                class="favorite-btn
               text-white
               text-sm
               font-medium
               py-2
               px-3
               rounded-lg
               transition-colors
               duration-200
               flex
               items-center
               gap-2"
                                th:classappend="${favoriteVideoIds.contains(video.id)}
            ? ' bg-green-600 hover:bg-green-700'
            : ' bg-yellow-500 hover:bg-yellow-600'"
                                th:data-video-id="${video.id}"
                                th:data-title="${video.title}"
                                th:data-thumbnail="${video.thumbnailUrl}"
                                th:data-channel="${video.channelTitle}"
                                th:disabled="${favoriteVideoIds.contains(video.id)}">

                            <i
                                    class="bi"
                                    th:classappend="${favoriteVideoIds.contains(video.id)}
                ? ' bi-star-fill'
                : ' bi-star'">
                            </i>

                            <span
                                    th:text="${favoriteVideoIds.contains(video.id)}
                ? 'Already in Favorites'
                : 'Add to Favorites'">
    </span>

                        </button>

                    </div>


                    <!-- TAGS -->

                    <div>


                        <!-- NO TAGS -->

                        <span
                                th:if="${#lists.isEmpty(video.tags)}"

                                class="text-slate-500
                                       dark:text-slate-400
                                       italic">

                            No tags found

                        </span>


                        <!-- TAGS -->

                        <span
                                th:each="tag : ${video.tags}"

                                class="tag
                                       inline-flex
                                       items-center
                                       gap-2
                                       rounded-full
                                       px-3
                                       py-2
                                       mr-2
                                       mb-2
                                       text-sm">


                            <i
                                    class="bi
                                           bi-tag">
                            </i>


                            <span
                                    th:text="${tag}">
                            </span>


                        </span>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         COPY SUCCESS
    ====================================================== -->

    <div
            id="copySuccess"

            class="success
                   hidden
                   rounded-lg
                   p-4
                   mb-4">

        Tags copied to clipboard!

    </div>


    <!-- =====================================================
         FAVORITE SUCCESS
    ====================================================== -->

    <div
            id="favoriteSuccess"

            class="success
                   hidden
                   rounded-lg
                   p-4
                   mb-4">

        Video added to favorites!

    </div>


</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>


    // =========================================================
    // COPY TAGS
    // =========================================================

    function copyTags(tags) {

        navigator.clipboard
            .writeText(tags)

            .then(() => {

                const success =
                    document.getElementById(
                        'copySuccess'
                    );


                success.classList.remove(
                    'hidden'
                );


                setTimeout(() => {

                    success.classList.add(
                        'hidden'
                    );

                }, 2000);

            })

            .catch(() => {

                alert(
                    'Could not copy tags.'
                );

            });

    }



    // =========================================================
    // FAVORITES
    // =========================================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {


            const favoriteButtons =
                document.querySelectorAll(
                    ".favorite-btn"
                );


            favoriteButtons.forEach(
                button => {


                    button.addEventListener(
                        "click",
                        async function () {


                            // -----------------------------------------
                            // VIDEO DATA
                            // -----------------------------------------

                            const videoId =
                                button.dataset.videoId;


                            const title =
                                button.dataset.title;


                            const thumbnailUrl =
                                button.dataset.thumbnail;


                            const channelTitle =
                                button.dataset.channel;



                            // -----------------------------------------
                            // CSRF TOKEN
                            // -----------------------------------------

                            const csrfToken =
                                document
                                    .querySelector(
                                        'meta[name="_csrf"]'
                                    )
                                    ?.getAttribute(
                                        "content"
                                    );


                            const csrfHeader =
                                document
                                    .querySelector(
                                        'meta[name="_csrf_header"]'
                                    )
                                    ?.getAttribute(
                                        "content"
                                    );



                            // -----------------------------------------
                            // FORM DATA
                            // -----------------------------------------

                            const formData =
                                new URLSearchParams();


                            formData.append(
                                "videoId",
                                videoId
                            );


                            formData.append(
                                "title",
                                title || ""
                            );


                            formData.append(
                                "thumbnailUrl",
                                thumbnailUrl || ""
                            );


                            formData.append(
                                "channelTitle",
                                channelTitle || ""
                            );



                            // -----------------------------------------
                            // HEADERS
                            // -----------------------------------------

                            const headers = {

                                "Content-Type":
                                    "application/x-www-form-urlencoded"

                            };


                            if (
                                csrfToken &&
                                csrfHeader
                            ) {

                                headers[csrfHeader] =
                                    csrfToken;

                            }



                            try {


                                // -------------------------------------
                                // SEND REQUEST
                                // -------------------------------------

                                const response =
                                    await fetch(
                                        "/favorites/add",
                                        {
                                            method: "POST",
                                            headers: headers,
                                            body: formData
                                        }
                                    );



                                // -------------------------------------
                                // RESPONSE
                                // -------------------------------------

                                if (!response.ok) {

                                    throw new Error(
                                        "Request failed"
                                    );

                                }


                                const result =
                                    await response.json();



                                // -------------------------------------
                                // SUCCESS
                                // -------------------------------------

                                if (result.success) {


                                    button.classList.remove(
                                        "bg-yellow-500",
                                        "hover:bg-yellow-600"
                                    );


                                    button.classList.add(
                                        "bg-green-600",
                                        "hover:bg-green-700"
                                    );


                                    button.innerHTML = `

                                        <i class="bi bi-star-fill"></i>

                                        <span>
                                            Added to Favorites
                                        </span>

                                    `;


                                    button.disabled =
                                        true;



                                    // Show message

                                    const success =
                                        document.getElementById(
                                            "favoriteSuccess"
                                        );


                                    success.classList.remove(
                                        "hidden"
                                    );


                                    setTimeout(() => {

                                        success.classList.add(
                                            "hidden"
                                        );

                                    }, 2000);



                                }


                                    // -------------------------------------
                                    // ALREADY FAVORITE
                                // -------------------------------------

                                else {


                                    button.classList.remove(
                                        "bg-yellow-500",
                                        "hover:bg-yellow-600"
                                    );


                                    button.classList.add(
                                        "bg-green-600",
                                        "hover:bg-green-700"
                                    );


                                    button.innerHTML = `

                                        <i class="bi bi-star-fill"></i>

                                        <span>
                                            Already Favorite
                                        </span>

                                    `;


                                    button.disabled =
                                        true;

                                }


                            } catch (error) {


                                console.error(
                                    "Favorite error:",
                                    error
                                );


                                alert(
                                    "Unable to add video to favorites."
                                );

                            }

                        }

                    );

                }

            );

        }

    );

</script>

<script>
    document.getElementById("seoForm")?.addEventListener("submit", function () {

        const button = document.getElementById("seoSubmitBtn");
        const normalText = document.getElementById("seoBtnText");
        const loadingText = document.getElementById("seoLoadingText");

        if (!button) return;

        button.disabled = true;
        button.classList.add("opacity-70", "cursor-not-allowed");

        normalText.classList.add("hidden");
        loadingText.classList.remove("hidden");
    });
</script>

</html>
