<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>403 - Access Denied | YouTube Tools</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="min-h-screen bg-slate-50 dark:bg-slate-950
             text-slate-900 dark:text-white
             flex items-center justify-center
             transition-colors duration-300">

<div class="text-center px-6 max-w-xl">

    <div class="mx-auto mb-6 w-20 h-20 rounded-2xl
                bg-red-100 dark:bg-red-900/30
                flex items-center justify-center">

        <i class="bi bi-shield-lock text-4xl
                  text-red-600 dark:text-red-400"></i>
    </div>

    <h1 class="text-8xl font-black tracking-tight
               text-red-600 dark:text-red-500">
        403
    </h1>

    <h2 class="mt-4 text-3xl font-bold">
        Access Denied
    </h2>

    <p class="mt-3 text-slate-500 dark:text-slate-400">
        You don't have permission to access this page.
    </p>

    <a th:href="@{/dashboard}"
       class="inline-flex items-center gap-2 mt-8
              px-6 py-3 rounded-xl
              bg-blue-600 hover:bg-blue-700
              text-white font-semibold
              transition">

        <i class="bi bi-speedometer2"></i>
        Back to Dashboard
    </a>

</div>

<button id="themeToggle"
        class="fixed top-5 right-5
               w-10 h-10 rounded-xl
               bg-white dark:bg-slate-800
               border border-slate-200 dark:border-slate-700
               shadow-sm
               flex items-center justify-center">

    <i id="themeIcon" class="bi bi-moon"></i>

</button>

<script>
    const html = document.documentElement;
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");

    function updateThemeIcon() {
        if (html.classList.contains("dark")) {
            themeIcon.className = "bi bi-sun text-yellow-400";
        } else {
            themeIcon.className = "bi bi-moon text-slate-700";
        }
    }

    if (localStorage.getItem("theme") === "dark") {
        html.classList.add("dark");
    }

    updateThemeIcon();

    themeToggle.addEventListener("click", () => {
        html.classList.toggle("dark");

        localStorage.setItem(
            "theme",
            html.classList.contains("dark") ? "dark" : "light"
        );

        updateThemeIcon();
    });
</script>

</body>
</html>
