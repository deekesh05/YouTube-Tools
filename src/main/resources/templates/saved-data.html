<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Saved Data - YouTube Tools</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>

</head>


<body class="bg-slate-50
             dark:bg-slate-900
             text-slate-900
             dark:text-slate-100
             min-h-screen">


<div
        th:replace="~{fragments/navbar :: navbar}"
        th:with="activePage='saved'">
</div>


<div class="container
            mx-auto
            px-4
            max-w-6xl
            mt-10
            pb-12">


    <!-- HEADER -->

    <div class="mb-8">

        <div class="flex items-center gap-3">

            <div class="w-12
                        h-12
                        rounded-xl
                        bg-blue-100
                        dark:bg-blue-900/30
                        flex
                        items-center
                        justify-center">

                <i class="bi bi-bookmark-fill
                          text-xl
                          text-blue-600
                          dark:text-blue-400">
                </i>

            </div>


            <div>

                <h1 class="text-3xl
                           md:text-4xl
                           font-bold">

                    Saved Data

                </h1>


                <p class="text-slate-500
                          dark:text-slate-400
                          mt-1">

                    Manage your saved videos and recent activity.

                </p>

            </div>

        </div>

    </div>


    <!-- GRID -->

    <div class="grid
                grid-cols-1
                lg:grid-cols-2
                gap-8">


        <!-- FAVORITES -->

        <div class="bg-white
                    dark:bg-slate-800
                    rounded-2xl
                    shadow-md
                    border
                    border-slate-200
                    dark:border-slate-700
                    overflow-hidden">


            <div class="flex
                        items-center
                        justify-between
                        px-6
                        py-5
                        border-b
                        border-slate-200
                        dark:border-slate-700">


                <h2 class="text-lg
                           font-bold
                           flex
                           items-center
                           gap-2">

                    <i class="bi bi-star-fill
                              text-yellow-500">
                    </i>

                    Favorites

                </h2>


                <a
                        href="/favorites"
                        class="text-sm
                               text-blue-600
                               dark:text-blue-400
                               hover:underline">

                    View All

                </a>

            </div>


            <div class="p-6">


                <!-- EMPTY -->

                <div
                        th:if="${favoriteList.isEmpty()}"
                        class="text-center
                               py-10">

                    <i class="bi bi-star
                              text-4xl
                              text-slate-300
                              dark:text-slate-600">
                    </i>


                    <p class="mt-3
                              text-slate-500
                              dark:text-slate-400">

                        No favorites saved.

                    </p>

                    <a
                            href="/"
                            class="inline-block
                                   mt-4
                                   text-sm
                                   text-blue-600
                                   dark:text-blue-400
                                   hover:underline">

                        Explore videos →

                    </a>

                </div>


                <!-- LIST -->

                <div
                        th:each="favorite : ${favoriteList}"

                        class="flex
                               gap-4
                               py-4
                               border-b
                               border-slate-200
                               dark:border-slate-700
                               last:border-0">


                    <img
                            th:src="${favorite.thumbnailUrl}"
                            class="w-24
                                   h-14
                                   object-cover
                                   rounded-lg
                                   flex-shrink-0">


                    <div class="min-w-0
                                flex-1">

                        <h3
                                class="font-semibold
                                       truncate"

                                th:text="${favorite.title}">

                        </h3>


                        <p
                                class="text-sm
                                       text-slate-500
                                       dark:text-slate-400
                                       truncate
                                       mt-1"

                                th:text="${favorite.channelTitle}">

                        </p>


                        <p
                                class="text-xs
                                       text-slate-400
                                       mt-1"

                                th:text="${#temporals.format(
                                    favorite.createdAt,
                                    'dd MMM yyyy'
                                )}">

                        </p>

                    </div>

                </div>

            </div>

        </div>


        <!-- HISTORY -->

        <div class="bg-white
                    dark:bg-slate-800
                    rounded-2xl
                    shadow-md
                    border
                    border-slate-200
                    dark:border-slate-700
                    overflow-hidden">


            <div class="flex
                        items-center
                        justify-between
                        px-6
                        py-5
                        border-b
                        border-slate-200
                        dark:border-slate-700">


                <h2 class="text-lg
                           font-bold
                           flex
                           items-center
                           gap-2">

                    <i class="bi bi-clock-history
                              text-blue-500">
                    </i>

                    History

                </h2>


                <a
                        href="/history"
                        class="text-sm
                               text-blue-600
                               dark:text-blue-400
                               hover:underline">

                    View All

                </a>

            </div>


            <div class="p-6">


                <!-- EMPTY -->

                <div
                        th:if="${historyList.isEmpty()}"
                        class="text-center
                               py-10">

                    <i class="bi bi-clock-history
                              text-4xl
                              text-slate-300
                              dark:text-slate-600">
                    </i>


                    <p class="mt-3
                              text-slate-500
                              dark:text-slate-400">

                        No history available.

                    </p>

                    <a
                            href="/"
                            class="inline-block
                                   mt-4
                                   text-sm
                                   text-blue-600
                                   dark:text-blue-400
                                   hover:underline">

                        Start using tools →

                    </a>

                </div>


                <!-- LIST -->

                <div
                        th:each="history : ${historyList}"

                        class="flex
                               gap-4
                               py-4
                               border-b
                               border-slate-200
                               dark:border-slate-700
                               last:border-0">


                    <img
                            th:src="${history.thumbnailUrl}"
                            class="w-24
                                   h-14
                                   object-cover
                                   rounded-lg
                                   flex-shrink-0">


                    <div class="min-w-0
                                flex-1">

                        <h3
                                class="font-semibold
                                       truncate"

                                th:text="${history.title}">

                        </h3>


                        <div class="flex
                                    items-center
                                    gap-2
                                    mt-1">

                            <span
                                    class="text-xs
                                           text-blue-600
                                           dark:text-blue-400"

                                    th:text="${history.toolType}">

                            </span>

                            <span class="text-slate-400">•</span>

                            <span
                                    class="text-xs
                                           text-slate-400"

                                    th:text="${#temporals.format(
                                        history.createdAt,
                                        'dd MMM yyyy'
                                    )}">

                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
