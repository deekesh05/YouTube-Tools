<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard - YouTube Tools</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>

</head>


<body class="bg-slate-50
             text-slate-900
             min-h-screen
             dark:bg-slate-900
             dark:text-slate-100">


<div
        th:replace="~{fragments/navbar :: navbar}"
        th:with="activePage='dashboard'">
</div>


<div class="container mx-auto
            px-4
            max-w-6xl
            mt-10
            pb-12">


    <!-- WELCOME -->

    <div class="mb-8">

        <div class="flex items-center gap-3">

            <div>

                <h1 class="text-3xl
                           md:text-4xl
                           font-bold">

                    Welcome back,

                    <span
                            class="text-blue-600
                                   dark:text-blue-400"
                            th:text="${user.name}">
                    </span>

                    👋

                </h1>

                <p class="text-slate-500
                          dark:text-slate-400
                          mt-2">

                    Manage your YouTube Tools activity from one place.

                </p>

            </div>

        </div>

    </div>


    <!-- STATISTICS -->

    <div class="grid
                grid-cols-1
                md:grid-cols-2
                gap-6
                mb-10">


        <!-- HISTORY CARD -->

        <div class="group
                    bg-white
                    dark:bg-slate-800
                    rounded-2xl
                    shadow-md
                    border
                    border-slate-200
                    dark:border-slate-700
                    p-6
                    hover:shadow-xl
                    transition-all">

            <div class="flex
                        justify-between
                        items-center">


                <div>

                    <p class="text-sm
                              font-medium
                              text-slate-500
                              dark:text-slate-400">

                        Total History

                    </p>


                    <h2 class="text-4xl
                               font-bold
                               mt-2">

                        <span th:text="${historyCount}">
                            0
                        </span>

                    </h2>


                    <a
                            href="/history"
                            class="inline-flex
                                   items-center
                                   gap-1
                                   mt-3
                                   text-sm
                                   text-blue-600
                                   dark:text-blue-400
                                   hover:underline">

                        View History

                        <i class="bi bi-arrow-right"></i>

                    </a>

                </div>


                <div class="w-14
                            h-14
                            rounded-2xl
                            bg-blue-100
                            dark:bg-blue-900/30
                            flex
                            items-center
                            justify-center
                            group-hover:scale-105
                            transition">

                    <i class="bi bi-clock-history
                              text-2xl
                              text-blue-600
                              dark:text-blue-400">
                    </i>

                </div>

            </div>

        </div>


        <!-- FAVORITES CARD -->

        <div class="group
                    bg-white
                    dark:bg-slate-800
                    rounded-2xl
                    shadow-md
                    border
                    border-slate-200
                    dark:border-slate-700
                    p-6
                    hover:shadow-xl
                    transition-all">

            <div class="flex
                        justify-between
                        items-center">


                <div>

                    <p class="text-sm
                              font-medium
                              text-slate-500
                              dark:text-slate-400">

                        Total Favorites

                    </p>


                    <h2 class="text-4xl
                               font-bold
                               mt-2">

                        <span th:text="${favoriteCount}">
                            0
                        </span>

                    </h2>


                    <a
                            href="/favorites"
                            class="inline-flex
                                   items-center
                                   gap-1
                                   mt-3
                                   text-sm
                                   text-blue-600
                                   dark:text-blue-400
                                   hover:underline">

                        View Favorites

                        <i class="bi bi-arrow-right"></i>

                    </a>

                </div>


                <div class="w-14
                            h-14
                            rounded-2xl
                            bg-yellow-100
                            dark:bg-yellow-900/20
                            flex
                            items-center
                            justify-center
                            group-hover:scale-105
                            transition">

                    <i class="bi bi-star-fill
                              text-2xl
                              text-yellow-500">
                    </i>

                </div>

            </div>

        </div>

    </div>


    <!-- RECENT SECTIONS -->

    <div class="grid
                grid-cols-1
                lg:grid-cols-2
                gap-8">


        <!-- RECENT HISTORY -->

        <div class="bg-white
                    dark:bg-slate-800
                    rounded-2xl
                    border
                    border-slate-200
                    dark:border-slate-700
                    shadow-md
                    overflow-hidden">


            <div class="flex
                        justify-between
                        items-center
                        px-6
                        py-5
                        border-b
                        border-slate-200
                        dark:border-slate-700">


                <h2 class="text-lg
                           font-bold
                           flex
                           items-center
                           gap-2">

                    <i class="bi bi-clock-history
                              text-blue-500">
                    </i>

                    Recent Activity

                </h2>


                <a
                        href="/history"
                        class="text-sm
                               text-blue-600
                               dark:text-blue-400
                               hover:underline">

                    View All

                </a>

            </div>


            <div class="p-6">


                <!-- EMPTY -->

                <div
                        th:if="${historyList.isEmpty()}"
                        class="text-center
                               py-10">

                    <i class="bi bi-clock-history
                              text-4xl
                              text-slate-300
                              dark:text-slate-600">
                    </i>

                    <p class="mt-3
                              text-slate-500
                              dark:text-slate-400">

                        No recent activity yet.

                    </p>

                    <a
                            href="/"
                            class="inline-block
                                   mt-4
                                   text-sm
                                   text-blue-600
                                   dark:text-blue-400
                                   hover:underline">

                        Start using tools →

                    </a>

                </div>


                <!-- LIST -->

                <div
                        th:each="history : ${historyList}"

                        class="flex
                               items-center
                               gap-4
                               py-4
                               border-b
                               border-slate-200
                               dark:border-slate-700
                               last:border-0">


                    <img
                            th:src="${history.thumbnailUrl}"
                            class="w-20
                                   h-12
                                   object-cover
                                   rounded-lg
                                   flex-shrink-0">


                    <div class="min-w-0
                                flex-1">

                        <h3
                                class="font-semibold
                                       truncate"

                                th:text="${history.title}">

                        </h3>


                        <div class="flex
                                    items-center
                                    gap-2
                                    mt-1">

                            <span
                                    class="text-xs
                                           text-blue-600
                                           dark:text-blue-400"

                                    th:text="${history.toolType}">

                            </span>

                            <span class="text-slate-400">•</span>

                            <span
                                    class="text-xs
                                           text-slate-400"

                                    th:text="${#temporals.format(
                                        history.createdAt,
                                        'dd MMM, hh:mm a'
                                    )}">

                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- RECENT FAVORITES -->

        <div class="bg-white
                    dark:bg-slate-800
                    rounded-2xl
                    border
                    border-slate-200
                    dark:border-slate-700
                    shadow-md
                    overflow-hidden">


            <div class="flex
                        justify-between
                        items-center
                        px-6
                        py-5
                        border-b
                        border-slate-200
                        dark:border-slate-700">


                <h2 class="text-lg
                           font-bold
                           flex
                           items-center
                           gap-2">

                    <i class="bi bi-star-fill
                              text-yellow-500">
                    </i>

                    Recent Favorites

                </h2>


                <a
                        href="/favorites"
                        class="text-sm
                               text-blue-600
                               dark:text-blue-400
                               hover:underline">

                    View All

                </a>

            </div>


            <div class="p-6">


                <!-- EMPTY -->

                <div
                        th:if="${favoriteList.isEmpty()}"
                        class="text-center
                               py-10">

                    <i class="bi bi-star
                              text-4xl
                              text-slate-300
                              dark:text-slate-600">
                    </i>

                    <p class="mt-3
                              text-slate-500
                              dark:text-slate-400">

                        No favorites yet.

                    </p>

                    <a
                            href="/"
                            class="inline-block
                                   mt-4
                                   text-sm
                                   text-blue-600
                                   dark:text-blue-400
                                   hover:underline">

                        Explore videos →

                    </a>

                </div>


                <!-- LIST -->

                <div
                        th:each="favorite : ${favoriteList}"

                        class="flex
                               items-center
                               gap-4
                               py-4
                               border-b
                               border-slate-200
                               dark:border-slate-700
                               last:border-0">


                    <img
                            th:src="${favorite.thumbnailUrl}"
                            class="w-20
                                   h-12
                                   object-cover
                                   rounded-lg
                                   flex-shrink-0">


                    <div class="min-w-0
                                flex-1">

                        <h3
                                class="font-semibold
                                       truncate"

                                th:text="${favorite.title}">

                        </h3>


                        <div class="flex
                                    items-center
                                    gap-2
                                    mt-1">

                            <span
                                    class="text-xs
                                           text-slate-500
                                           dark:text-slate-400
                                           truncate"

                                    th:text="${favorite.channelTitle}">

                            </span>

                            <span class="text-slate-400">•</span>

                            <span
                                    class="text-xs
                                           text-slate-400
                                           whitespace-nowrap"

                                    th:text="${#temporals.format(
                                        favorite.createdAt,
                                        'dd MMM'
                                    )}">

                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
