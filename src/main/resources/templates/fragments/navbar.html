    <!-- =====================================================
         NAVBAR SCRIPT
    ====================================================== -->

    <script>

        const mobileMenuButton =
            document.getElementById("mobileMenuButton");

        const mobileMenu =
            document.getElementById("mobileMenu");

        const mobileMenuIcon =
            document.getElementById("mobileMenuIcon");


        /*
         * MOBILE MENU
         */

        if (mobileMenuButton) {

            mobileMenuButton.addEventListener(
                "click",
                function () {

                    const isOpen =
                        !mobileMenu.classList.contains("hidden");

                    mobileMenu.classList.toggle(
                        "hidden"
                    );

                    mobileMenuButton.setAttribute(
                        "aria-expanded",
                        String(!isOpen)
                    );


                    if (!isOpen) {

                        mobileMenuIcon.className =
                            "bi bi-x-lg text-lg";

                    } else {

                        mobileMenuIcon.className =
                            "bi bi-list text-xl";

                    }

                }
            );

        }


        /*
         * THEME
         */

        const desktopToggle =
            document.getElementById(
                "themeToggleDesktop"
            );

        const mobileToggle =
            document.getElementById(
                "themeToggleMobile"
            );

        const desktopIcon =
            document.getElementById(
                "themeIconDesktop"
            );

        const mobileIcon =
            document.getElementById(
                "themeIconMobile"
            );

        const mobileText =
            document.getElementById(
                "themeTextMobile"
            );


        function updateThemeUI() {

            const isDark =
                document.documentElement
                    .classList
                    .contains("dark");


            if (desktopIcon) {

                desktopIcon.className =
                    isDark
                        ? "bi bi-moon-fill text-sm"
                        : "bi bi-sun-fill text-sm";

            }


            if (mobileIcon) {

                mobileIcon.className =
                    isDark
                        ? "bi bi-moon-fill"
                        : "bi bi-sun-fill";

            }


            if (mobileText) {

                mobileText.textContent =
                    isDark
                        ? "Dark Mode"
                        : "Light Mode";

            }

        }


        function toggleTheme() {

            const htmlTag =
                document.documentElement;


            const isDark =
                htmlTag.classList.contains("dark");


            if (isDark) {

                htmlTag.classList.remove("dark");

                localStorage.setItem(
                    "theme",
                    "light"
                );

            } else {

                htmlTag.classList.add("dark");

                localStorage.setItem(
                    "theme",
                    "dark"
                );

            }


            updateThemeUI();

        }


        if (desktopToggle) {

            desktopToggle.addEventListener(
                "click",
                toggleTheme
            );

        }


        if (mobileToggle) {

            mobileToggle.addEventListener(
                "click",
                toggleTheme
            );

        }


        /*
         * PAGE LOAD
         */

        if (
            localStorage.getItem("theme")
            === "dark"
        ) {

            document.documentElement
                .classList
                .add("dark");

        }


        updateThemeUI();

    </script>
