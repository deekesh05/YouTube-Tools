<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Favorites - YouTube Tools</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>

</head>


<body class="bg-slate-50
             text-slate-900
             min-h-screen
             dark:bg-slate-900
             dark:text-slate-100">


<!-- NAVBAR -->

<div
        th:replace="~{fragments/navbar :: navbar}"
        th:with="activePage='favorites'">
</div>


<!-- MAIN -->

<div class="container mx-auto
            px-4
            max-w-6xl
            mt-12
            pb-12">


    <!-- HEADER -->

    <div class="text-center mb-10">

        <div class="flex
                    justify-center
                    items-center
                    gap-3">

            <i class="bi bi-star-fill
                      text-yellow-500
                      text-4xl">
            </i>

            <h1 class="text-4xl
                       md:text-5xl
                       font-extrabold
                       text-blue-600
                       dark:text-blue-400">

                Favorites

            </h1>

        </div>


        <p class="text-slate-600
                  dark:text-slate-400
                  mt-3">

            Your bookmarked YouTube videos.

        </p>

    </div>


    <!-- EMPTY STATE -->

    <div
            th:if="${#lists.isEmpty(favoriteList)}"

            class="bg-white
                   dark:bg-slate-800
                   border
                   border-slate-200
                   dark:border-slate-700
                   rounded-2xl
                   shadow-lg
                   p-12
                   text-center">


        <i class="bi bi-star
                  text-6xl
                  text-slate-400">
        </i>


        <h2 class="text-2xl
                   font-semibold
                   mt-5">

            No Favorites Yet

        </h2>


        <p class="text-slate-500
                  dark:text-slate-400
                  mt-3">

            Bookmark useful YouTube videos
            and they will appear here.

        </p>


        <a
                href="/"
                class="inline-flex
                       items-center
                       gap-2
                       mt-6
                       bg-blue-600
                       hover:bg-blue-700
                       text-white
                       px-5
                       py-3
                       rounded-xl
                       font-semibold">

            <i class="bi bi-search"></i>

            Explore Videos

        </a>

    </div>


    <!-- FAVORITE LIST -->

    <div
            th:if="${!#lists.isEmpty(favoriteList)}"
            class="grid
                   grid-cols-1
                   md:grid-cols-2
                   gap-6">


        <div
                th:each="favorite : ${favoriteList}"

                class="bg-white
                       dark:bg-slate-800
                       border
                       border-slate-200
                       dark:border-slate-700
                       rounded-2xl
                       shadow-md
                       overflow-hidden">


            <!-- THUMBNAIL -->

            <div
                    th:if="${favorite.thumbnailUrl != null}">

                <img
                        th:src="${favorite.thumbnailUrl}"
                        alt="Video Thumbnail"

                        class="w-full
                               h-48
                               object-cover">

            </div>


            <!-- CONTENT -->

            <div class="p-5">


                <!-- TITLE -->

                <h2
                        class="text-lg
                               font-semibold
                               line-clamp-2"

                        th:text="${favorite.title
                                  != null
                                  ? favorite.title
                                  : 'YouTube Video'}">

                </h2>


                <!-- CHANNEL -->

                <p
                        th:if="${favorite.channelTitle != null}"

                        class="text-sm
                               text-slate-500
                               dark:text-slate-400
                               mt-2"

                        th:text="${favorite.channelTitle}">

                </p>


                <!-- DATE -->

                <p
                        class="text-xs
                               text-slate-400
                               mt-2"

                        th:text="${favorite.createdAt}">

                </p>


                <!-- ACTIONS -->

                <div
                        class="flex
                               gap-3
                               mt-5">


                    <!-- OPEN YOUTUBE -->

                    <a
                            th:href="@{'https://www.youtube.com/watch?v=' + ${favorite.videoId}}"

                            target="_blank"

                            class="flex-1
                                   bg-blue-600
                                   hover:bg-blue-700
                                   text-white
                                   px-4
                                   py-2
                                   rounded-lg
                                   text-sm
                                   font-medium
                                   flex
                                   justify-center
                                   items-center
                                   gap-2">

                        <i class="bi bi-youtube"></i>

                        Open Video

                    </a>


                    <!-- REMOVE -->

                    <form
                            th:action="@{/favorites/remove/{id}(id=${favorite.id})}"
                            method="post">


                        <input
                                type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}">


                        <button
                                type="submit"

                                class="bg-red-500
                                       hover:bg-red-600
                                       text-white
                                       px-4
                                       py-2
                                       rounded-lg
                                       text-sm
                                       flex
                                       items-center
                                       gap-2">


                            <i class="bi bi-trash"></i>

                            Remove

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
